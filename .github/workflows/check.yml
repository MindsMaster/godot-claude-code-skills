name: check

on:
  push:
  pull_request:

env:
  GODOT_TAG: 4.8-beta4
  GODOT_SDK_VERSION: 4.8.0-beta.4

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 插件清单
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: xvfb 与 lavapipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
      - name: Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          echo "GODOT_BIN=$PWD/godot" >> "$GITHUB_ENV"
      - run: python3 tests/check.py
